name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Project Anywhere
        run: |
          # 1. build.gradle ढूंढें
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle found. Creating minimum project configuration..."
            mkdir -p app/src/main
            echo "apply plugin: 'com.android.application'" > app/build.gradle
            echo "include ':app'" > settings.gradle
            PROJ_DIR="."
          else
            PROJ_DIR=$(dirname "$BUILD_FILE")
          fi

          cd "$PROJ_DIR"
          echo "Working directory: $(pwd)"

          # 2. अगर settings.gradle नहीं है तो बनाएँ
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "include ':app'" > settings.gradle
          fi

          # 3. Gradle Wrapper बनाएँ और permissions दें
          gradle wrapper
          chmod +x gradlew

          # 4. APK बनाएँ
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
