name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Missing Files and Build APK
        run: |
          # 1. 'app' फोल्डर की सही लोकेशन ढूँढें
          APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: Could not find 'app' folder!"
            exit 1
          fi

          # 2. पेरेंट फोल्डर (प्रोजेक्ट रूट) में जाएँ
          PROJ_DIR=$(dirname "$APP_DIR")
          cd "$PROJ_DIR"
          echo "Working in project directory: $(pwd)"

          # 3. अगर settings.gradle नहीं है, तो उसे खुद बनाएँ
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "settings.gradle missing! Creating it..."
            echo "include ':app'" > settings.gradle
          fi

          # 4. Gradle Wrapper जनरेट करें
          gradle wrapper
          chmod +x gradlew

          # 5. APK बिल्ड करें
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
